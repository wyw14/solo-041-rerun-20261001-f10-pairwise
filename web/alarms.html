<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTreat 异常处置</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><header><div class="brand">BioTreat 工艺联控</div><nav><a href="/process">工艺总控</a><a href="/aeration">曝气调节</a><a href="/sludge">污泥回流</a><a aria-current="page" href="/alarms">异常处置</a></nav></header>
<main><div class="page-head"><div><h1>工艺告警</h1><div class="muted">按告警类型与设备归并的完整故障：首次/再次触发、确认人、处置说明、恢复时间</div></div><div class="status"><span class="dot"></span><span id="health">checking</span></div></div>
<div class="grid"><section class="panel wide"><h2>故障记录</h2><div class="filters" id="filters"><button data-status="all">全部</button><button data-status="active">活跃</button><button data-status="acknowledged">已确认</button><button data-status="recovered">已恢复</button></div><table><thead><tr><th>级别</th><th>处理线</th><th>设备</th><th>告警类型</th><th>内容</th><th>触发</th><th>首次触发</th><th>再次触发</th><th>确认人</th><th>处置说明</th><th>恢复时间</th><th>状态</th><th>时间线</th><th></th></tr></thead><tbody id="alarms"></tbody></table></section><section class="panel"><h2>污泥界面采样</h2><form id="blanket"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>界面高度 m<input name="level" type="number" step="0.1" value="3.1"></label><button>更新沉降状态</button></form></section><section class="panel wide"><h2>处置结果</h2><pre id="output">等待处置</pre></section></div></main>
<script src="/assets/common.js"></script><script>
let currentFilter = "all";

const STATUS_TEXT = { active: "活跃", acknowledged: "已确认", recovered: "已恢复" };
const TIMELINE_TEXT = {
  raised: "首次触发",
  retriggered: "再次触发",
  confirmed: "确认",
  handled: "处置记录",
  recovered: "恢复",
};

function fmt(value) {
  return value ? new Date(value).toLocaleString() : "—";
}

function statusOf(episode) {
  if (episode.recovered_at) return "recovered";
  if (episode.acknowledged_at) return "acknowledged";
  return "active";
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function actionCell(episode) {
  const status = statusOf(episode);
  if (status === "recovered") return "";
  const id = episode.id;
  if (status === "active") {
    return `<button data-action="ack" data-id="${id}">确认</button>`;
  }
  return `<button data-action="note" data-id="${id}">补充说明</button> <button data-action="recover" data-id="${id}">恢复</button>`;
}

function timelineRows(episode) {
  return (episode.timeline || []).map(entry => {
    const detail = [entry.actor && `确认人：${entry.actor}`, entry.note && entry.note, entry.message].filter(Boolean).join(" / ");
    return `<li><span class="muted">${fmt(entry.at)}</span> ${esc(TIMELINE_TEXT[entry.kind] || entry.kind)}${detail ? ` — ${esc(detail)}` : ""}</li>`;
  }).join("");
}

async function load() {
  const data = await request(`/api/alarms?status=${encodeURIComponent(currentFilter)}`);
  document.querySelector("#filters").dataset.status = currentFilter;
  document.querySelectorAll("#filters button").forEach(button => {
    button.classList.toggle("active", button.dataset.status === currentFilter);
  });
  document.querySelector("#alarms").innerHTML = data.episodes.map(episode => {
    const status = statusOf(episode);
    return `
    <tr>
      <td>${esc(episode.severity)}</td>
      <td>${esc(episode.line_id)}</td>
      <td>${esc(episode.device_id) || "—"}</td>
      <td>${esc(episode.code)}</td>
      <td>${esc(episode.message)}</td>
      <td>${episode.trigger_count}</td>
      <td>${fmt(episode.first_raised_at)}</td>
      <td>${fmt(episode.retriggered_at)}</td>
      <td>${esc(episode.acknowledged_by) || "—"}</td>
      <td>${esc(episode.handled_note) || "—"}</td>
      <td>${fmt(episode.recovered_at)}</td>
      <td>${STATUS_TEXT[status] || status}</td>
      <td><button data-action="timeline" data-id="${episode.id}">查看</button><div class="timeline" id="timeline-${episode.id}" hidden><ul>${timelineRows(episode)}</ul></div></td>
      <td>${actionCell(episode)}</td>
    </tr>`;
  }).join("");
  document.querySelectorAll("#alarms [data-action]").forEach(button => {
    button.onclick = async () => {
      const id = button.dataset.id;
      try {
        if (button.dataset.action === "timeline") {
          const box = document.querySelector(`#timeline-${id}`);
          box.hidden = !box.hidden;
          return;
        }
        if (button.dataset.action === "ack") {
          const confirmer = prompt("确认人姓名");
          if (confirmer === null) return;
          const note = prompt("处置说明（可留空）") || "";
          show(await request(`/api/alarms/${id}/ack`, { method: "POST", body: JSON.stringify({ confirmer, note }) }));
        } else if (button.dataset.action === "note") {
          const note = prompt("补充处置说明");
          if (note === null) return;
          show(await request(`/api/alarms/${id}/ack`, { method: "POST", body: JSON.stringify({ note }) }));
        } else if (button.dataset.action === "recover") {
          if (!confirm("标记该故障已恢复？")) return;
          show(await request(`/api/alarms/${id}/recover`, { method: "POST", body: "{}" }));
        }
        load();
      } catch (err) {
        showError(err);
      }
    };
  });
}

document.querySelector("#filters").addEventListener("click", event => {
  const button = event.target.closest("button[data-status]");
  if (!button) return;
  currentFilter = button.dataset.status;
  load().catch(showError);
});

document.querySelector("#blanket").addEventListener("submit", async event => {
  event.preventDefault();
  const form = new FormData(event.target);
  try {
    show(await request(`/api/settling/${form.get("line")}/blanket`, { method: "POST", body: JSON.stringify({ level: Number(form.get("level")) }) }));
    load();
  } catch (err) {
    showError(err);
  }
});

load().catch(showError);
</script></body></html>
