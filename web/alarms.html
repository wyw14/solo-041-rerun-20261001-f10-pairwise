<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTreat 异常处置</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><header><div class="brand">BioTreat 工艺联控</div><nav><a href="/process">工艺总控</a><a href="/aeration">曝气调节</a><a href="/sludge">污泥回流</a><a aria-current="page" href="/alarms">异常处置</a></nav></header>
<main><div class="page-head"><div><h1>工艺告警</h1><div class="muted">按报警类型与设备归并的故障段,含确认人、处置说明与恢复时间</div></div><div class="status"><span class="dot"></span><span id="health">checking</span></div></div>
<div class="grid"><section class="panel wide"><h2>故障段</h2>
<div id="filters"><button data-status="" class="active">全部</button><button data-status="active">活跃</button><button data-status="acknowledged">已确认</button><button data-status="recovered">已恢复</button></div>
<table><thead><tr><th>级别</th><th>处理线</th><th>设备</th><th>类型</th><th>内容</th><th>首次触发</th><th>最近触发</th><th>次数</th><th>状态</th><th>确认人</th><th>处置说明</th><th>恢复时间</th><th></th></tr></thead><tbody id="alarms"></tbody></table></section>
<section class="panel"><h2>处置信息</h2><form id="ackinfo"><label>确认人<input name="operator" required placeholder="值班员姓名"></label><label>处置说明<input name="note" placeholder="处置措施说明"></label><div class="muted">填写后点击故障段行的「确认」生效</div></form></section>
<section class="panel"><h2>污泥界面采样</h2><form id="blanket"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>界面高度 m<input name="level" type="number" step="0.1" value="3.1"></label><button>更新沉降状态</button></form></section>
<section class="panel wide"><h2>原始报警时间线</h2><table><thead><tr><th>级别</th><th>处理线</th><th>设备</th><th>类型</th><th>内容</th><th>触发时间</th><th>状态</th></tr></thead><tbody id="timeline"></tbody></table></section>
<section class="panel wide"><h2>处置结果</h2><pre id="output">等待处置</pre></section></div></main>
<script src="/assets/common.js"></script><script>
let statusFilter='';
const STATUS={active:'活跃',acknowledged:'已确认',recovered:'已恢复'};
const fmt=t=>t?new Date(t).toLocaleString():'—';
function episodeStatus(e){if(e.recovered_at)return'recovered';if(e.acknowledged_at)return'acknowledged';return'active'}
async function load(){
  const d=await request('/api/alarms'+(statusFilter?`?status=${statusFilter}`:''));
  document.querySelector('#alarms').innerHTML=(d.alarms||[]).map(e=>{const st=episodeStatus(e);return`<tr><td>${e.severity}</td><td>${e.line_id}</td><td>${e.device_id}</td><td>${e.code}</td><td>${e.message}</td><td>${fmt(e.first_raised_at)}</td><td>${fmt(e.last_raised_at)}</td><td>${e.trigger_count}</td><td>${STATUS[st]}</td><td>${e.acknowledged_by||'—'}</td><td>${e.note||'—'}</td><td>${fmt(e.recovered_at)}</td><td>${st==='active'?`<button data-ack="${e.id}">确认</button>`:''}${st!=='recovered'?`<button data-rec="${e.id}">恢复</button>`:''}</td></tr>`}).join('');
  document.querySelectorAll('[data-ack]').forEach(b=>b.onclick=async()=>{
    const f=new FormData(document.querySelector('#ackinfo'));
    try{show(await request(`/api/alarms/${b.dataset.ack}/ack`,{method:'POST',body:JSON.stringify({operator:f.get('operator'),note:f.get('note')})}));load()}catch(err){showError(err)}});
  document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=async()=>{
    try{show(await request(`/api/alarms/${b.dataset.rec}/recover`,{method:'POST',body:'{}'}));load()}catch(err){showError(err)}});
}
async function loadTimeline(){
  const d=await request('/api/alarms/timeline');
  document.querySelector('#timeline').innerHTML=(d.alarms||[]).map(a=>`<tr><td>${a.severity}</td><td>${a.line_id}</td><td>${a.device_id}</td><td>${a.code}</td><td>${a.message}</td><td>${fmt(a.raised_at)}</td><td>${a.recovered_at?'已恢复':a.acknowledged?'已确认':'待确认'}</td></tr>`).join('');
}
function reload(){load().catch(showError);loadTimeline().catch(showError)}
document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{statusFilter=b.dataset.status;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));load().catch(showError)});
document.querySelector('#blanket').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{show(await request(`/api/settling/${f.get('line')}/blanket`,{method:'POST',body:JSON.stringify({level:Number(f.get('level'))})}));reload()}catch(err){showError(err)}});
reload();
</script></body></html>
